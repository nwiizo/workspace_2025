#     - issuer: "https://your-issuer.com"
#       jwksUri: "https://your-issuer.com/.well-known/jwks.json"
---
# -----------------------------------------------------------------------------
# EnvoyFilter - Custom Response Headers
# カスタムレスポンスヘッダーの追加
# -----------------------------------------------------------------------------
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: custom-response-headers
  namespace: default
spec:
  configPatches:
    - applyTo: NETWORK_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: "envoy.filters.network.http_connection_manager"
      patch:
        operation: MERGE
        value:
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
            server_header_transformation: APPEND_IF_ABSENT
---
# -----------------------------------------------------------------------------
# ServiceEntry - External Service Access (Example)
# 外部サービスへのアクセス制御
# -----------------------------------------------------------------------------
# apiVersion: networking.istio.io/v1alpha3
# kind: ServiceEntry
# metadata:
#   name: external-api
# spec:
#   hosts:
#     - api.external-service.com
#   ports:
#     - number: 443
#       name: https
#       protocol: HTTPS
#   resolution: DNS
#   location: MESH_EXTERNAL
---
# -----------------------------------------------------------------------------
# Telemetry - Metrics and Tracing Configuration
# メトリクスとトレーシングの設定
# -----------------------------------------------------------------------------
apiVersion: telemetry.istio.io/v1alpha1
kind: Telemetry
metadata:
  name: mesh-default
  namespace: default
spec:
  # Tracing configuration
  tracing:
    - randomSamplingPercentage: 100.0
      customTags:
        environment:
          literal:
            value: "demo"
        app_version:
          literal:
            value: "v1"

  # Access logging
  accessLogging:
    - providers:
        - name: envoy
      filter:
        expression: "response.code >= 400"
